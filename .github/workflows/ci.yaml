name: CI

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/selfservice-crucible-runner

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Go test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

  build:
    name: Build runner image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable deployment digest
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          printf '%s\t%s\t%s\t%s\n' \
            "crucible-runner" "${{ env.IMAGE }}" "$DIGEST" "$SOURCE_SHA" \
            > image-digest.tsv

      - name: Upload image-digest.tsv
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-crucible-runner
          path: image-digest.tsv
          if-no-files-found: error
          retention-days: 90

      - name: Write image-manifest.json
        if: github.event_name == 'push'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          manifest = {
              "schema_version": 1,
              "source_repository": "jmal1/selfservice-crucible-runner",
              "source_sha": os.environ["SOURCE_SHA"],
              "images": [{
                  "component": "crucible-runner",
                  "repository": os.environ.get("IMAGE", "ghcr.io/jmal1/selfservice-crucible-runner"),
                  "digest": os.environ["DIGEST"],
                  "source_sha": os.environ["SOURCE_SHA"],
              }],
          }
          open("image-manifest.json", "w", encoding="utf-8").write(json.dumps(manifest, indent=2) + "\n")
          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload image-manifest.json
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: image-manifest
          path: image-manifest.json
          if-no-files-found: error
          retention-days: 90
